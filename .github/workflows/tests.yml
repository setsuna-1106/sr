name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py
      - run: python scripts/sr.py doctor --verify --strict
      - run: python scripts/sr.py index --check
      - run: python toolbox/paper-ir/paper_ir.py validate projects/paper-ir/examples/toy-paper.json
      - run: git diff --check
